services:
  zkp-lab:
    build: .
    container_name: zkp-lab
    restart: unless-stopped
    ports:
      - "8080:8080"          # changez le port de gauche si 8080 est pris
    environment:
      # Laissez vide pour qu'un jeton soit généré et affiché dans les logs.
      ZKP_ADMIN_TOKEN: "${ZKP_ADMIN_TOKEN:-}"
      # Taille de p au niveau 1 (appliquée seulement quand l'état est créé).
      ZKP_SMALL_BITS: "${ZKP_SMALL_BITS:-22}"
    volumes:
      - zkp-data:/app/data   # état persistant (joueurs, secret)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  zkp-data:
